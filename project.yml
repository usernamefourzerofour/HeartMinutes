name: Puls
options:
  bundleIdPrefix: dk.erik
  developmentLanguage: en
  deploymentTarget: { iOS: "27.0", watchOS: "11.0" }
settings:
  base:
    # The same version numbers for the iPhone app, watch app and complication (Apple requires it).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "70"
    # Translations: English source strings are extracted into String Catalogs (Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Puls:
    type: application
    platform: iOS
    sources: [Puls, Shared]
    entitlements:
      path: Puls/Puls.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.dk.erik.puls]
    info:
      path: Puls/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, bg, ca, cs, da, de, el, es, es-419, fi, fr, he, hi, hr, hu, id, it, ja, ko, lt, ms, nb, nl, pl, pt-BR, pt-PT, ro, ru, sk, sl, sv, th, tr, uk, vi, zh-Hans, zh-Hant]
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Heart Minutes
        CFBundleURLTypes:
          - CFBundleURLName: dk.erik.puls
            CFBundleURLSchemes: [heartminutes]
        NSHealthUpdateUsageDescription: "Heart Minutes doesn’t save data in Health – it only reads your heart rate measurements and workouts."
        NSHealthShareUsageDescription: "Heart Minutes reads your heart rate measurements and workouts from Apple Watch to show them in charts."
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dk.erik.puls.refresh]
    dependencies:
      - target: PulsWatch
      - target: PulsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.puls
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Apple Watch app: calculates this week's Heart Minutes on the watch and saves them for the complication.
  PulsWatch:
    type: application
    platform: watchOS
    sources:
      - PulsWatch
      - Shared
      - Puls/ActiveMinutes.swift
      - Puls/HealthManager.swift
      - Puls/HeartZones.swift
      - Puls/Period.swift
    entitlements:
      path: PulsWatch/PulsWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.dk.erik.puls]
    info:
      path: PulsWatch/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, bg, ca, cs, da, de, el, es, es-419, fi, fr, he, hi, hr, hu, id, it, ja, ko, lt, ms, nb, nl, pl, pt-BR, pt-PT, ro, ru, sk, sl, sv, th, tr, uk, vi, zh-Hans, zh-Hant]
        CFBundleDisplayName: Heart Minutes
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: dk.erik.puls
        NSHealthUpdateUsageDescription: "Heart Minutes doesn’t save data in Health – it only reads your heart rate measurements and workouts."
        NSHealthShareUsageDescription: "Heart Minutes reads your heart rate measurements and workouts to show this week’s Heart Minutes on your watch."
    dependencies:
      - target: PulsWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.puls.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Complications (WidgetKit) on the watch face.
  PulsWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - PulsWatchWidget
      - Shared
      - Puls/Period.swift
    entitlements:
      path: PulsWatchWidget/PulsWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.erik.puls]
    info:
      path: PulsWatchWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, bg, ca, cs, da, de, el, es, es-419, fi, fr, he, hi, hr, hu, id, it, ja, ko, lt, ms, nb, nl, pl, pt-BR, pt-PT, ro, ru, sk, sl, sv, th, tr, uk, vi, zh-Hans, zh-Hant]
        CFBundleDisplayName: Heart Minutes
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.puls.watchkitapp.widget

  # iPhone widgets: Home Screen (with chart), Lock Screen and StandBy.
  PulsWidget:
    type: app-extension
    platform: iOS
    sources:
      - PulsWidget
      - Shared
      - Puls/Period.swift
    entitlements:
      path: PulsWidget/PulsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.erik.puls]
    info:
      path: PulsWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar, bg, ca, cs, da, de, el, es, es-419, fi, fr, he, hi, hr, hu, id, it, ja, ko, lt, ms, nb, nl, pl, pt-BR, pt-PT, ro, ru, sk, sl, sv, th, tr, uk, vi, zh-Hans, zh-Hant]
        CFBundleDisplayName: Heart Minutes
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.erik.puls.widget
        TARGETED_DEVICE_FAMILY: "1"

  PulsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PulsTests]
    dependencies: [{ target: Puls }]
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES }
